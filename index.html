<script>
    // Настройка времени таймера в секундах (30 минут = 1800 секунд)
    const REFRESH_INTERVAL = 30 * 60; 
    let timeLeft = REFRESH_INTERVAL;
    
    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
    
        const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
        const displaySeconds = seconds < 10 ? '0' + seconds : seconds;
    
        document.getElementById('countdown').textContent = `${displayMinutes}:${displaySeconds}`;
    
        if (timeLeft <= 0) {
            refreshAllIframes();
            timeLeft = REFRESH_INTERVAL;
        } else {
            timeLeft--;
        }
    }
    
    // Принудительное обновление iframe с обходом кэша браузера
    function refreshAllIframes() {
        const iframes = document.getElementsByTagName('iframe');
        for (let i = 0; i < iframes.length; i++) {
            try {
                let url = new URL(iframes[i].src);
                url.searchParams.set('t', Date.now());
                iframes[i].src = url.toString();
            } catch (e) {
                const cleanSrc = iframes[i].src.replace(/[&?]t=\d+/, '');
                iframes[i].src = cleanSrc + (cleanSrc.includes('?') ? '&' : '?') + 't=' + Date.now();
            }
        }
    }
    
    function openTab(evt, tabId) {
        const tabContents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < tabContents.length; i++) {
            tabContents[i].classList.remove("active");
        }
        const tabButtons = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < tabButtons.length; i++) {
            tabButtons[i].classList.remove("active");
        }
        document.getElementById(tabId).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
    
    setInterval(updateTimer, 1000);
</script>
